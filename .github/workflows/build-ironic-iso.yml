name: Build Ironic ISO

on:
  push:
    branches: [ master ]
    tags: [ "v*", "release-*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      ipa_branch:
        description: 'IPA branch/ref for ironic-python-agent (passed as -b/--branch to ironic-python-agent-builder)'
        required: false
        default: 'stable/2026.1'
        type: string

jobs:
  build-ironic-iso:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
      options: --privileged

    env:
      BASE_DISTRO: centos
      DIB_RELEASE: "9-stream"
      IPA_BRANCH: ${{ github.event.inputs.ipa_branch || 'stable/2026.1' }}
      ARTIFACTS_DIR: artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            git \
            qemu-img \
            kpartx \
            squashfs-tools \
            xorriso \
            syslinux \
            syslinux-nonlinux \
            python3-devel \
            gcc \
            make \
            libffi-devel \
            openssl-devel \
            python3-pip \
            dosfstools \
            mtools \
            shim-x64 \
            grub2-efi-x64

      - name: Create sudo wrapper for container
        run: |
          cat > /usr/local/bin/sudo <<'SUDO_WRAPPER'
          #!/bin/bash
          # No-op sudo wrapper for container (already running as root)
          # Strip common sudo flags and execute the remaining command
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -E|-H|-n|-v|-k|-l|-S|-p|-r|-t|-u|-g|-h)
                # These flags may or may not have arguments
                case "$1" in
                  -p|-r|-t|-u|-g|-h) shift ;;  # These take an argument
                esac
                shift ;;
              -*)
                # Other flags without arguments
                shift ;;
              *)
                # First non-flag argument is the start of the actual command
                break ;;
            esac
          done
          # Execute the remaining command
          exec "$@"
          SUDO_WRAPPER
          chmod +x /usr/local/bin/sudo

      - name: Upgrade pip and install Python packages
        run: |
          python3 -m pip install --upgrade pip
          # Pin to coordinated versions for the 2026.1 release series for full reproducibility.
          # These align with upper-constraints used by ironic-python-agent-builder 7.2.0.
          pip3 install \
            diskimage-builder==3.40.2 \
            ironic-python-agent-builder==7.2.0

      - name: Show versions
        run: |
          echo "IPA branch targeted: ${IPA_BRANCH}"
          python3 --version
          pip3 show diskimage-builder || true
          pip3 show ironic-python-agent-builder || true

      - name: Build Ironic ISO
        run: |
          chmod +x scripts/build_ironic_iso.sh
          bash scripts/build_ironic_iso.sh

      - name: Validate build-info.txt
        run: |
          echo "=== Contents of build-info.txt ==="
          cat artifacts/build-info.txt
          echo "=================================="

          if [[ ! -f artifacts/build-info.txt ]]; then
            echo "ERROR: artifacts/build-info.txt was not created"
            exit 1
          fi

          if ! grep -q "IPA_BRANCH=${IPA_BRANCH}" artifacts/build-info.txt; then
            echo "ERROR: build-info.txt does not contain the expected IPA_BRANCH=${IPA_BRANCH}"
            exit 1
          fi

          echo "build-info.txt validation passed for IPA_BRANCH=${IPA_BRANCH}"

      - name: Summarize artifacts
        if: success()
        run: |
          {
            echo "## Build artifacts"
            echo ""
            echo "Download from this run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts"
            echo ""
            echo "- Primary: **ironic-centos9-iso** (ISO, kernel, initramfs, ESP, build-info)"
            echo "- Debug: **build-logs-and-outputs**"
            echo ""
            echo "For Ironic testing, prefer the \`.kernel\` and \`.initramfs\` files and pass dynamic-login params via kernel append (see README)."
            echo ""
            echo "Files:"
            ls -lh artifacts/ | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironic-centos9-iso
          path: |
            artifacts/*.iso
            artifacts/*.kernel
            artifacts/*.initramfs
            artifacts/*.img
            artifacts/build-info.txt
          retention-days: 7

      - name: Upload logs and build outputs (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-outputs
          path: |
            ipa-build/**
            iso-work/**
            artifacts/**
          if-no-files-found: ignore

  # Separate job on ubuntu so Node-based actions work (build runs in CentOS container).
  comment-pr-artifacts:
    name: Comment artifact links on PR
    needs: build-ironic-iso
    if: github.event_name == 'pull_request' && needs.build-ironic-iso.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Post or update PR comment with artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const marker = '<!-- ironic-iso-artifacts -->';

            const { data: artifactList } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const lines = artifactList.artifacts
              .filter((a) => !a.expired)
              .map((a) => {
                const sizeMiB = (a.size_in_bytes / (1024 * 1024)).toFixed(1);
                const url = `${runUrl}/artifacts/${a.id}`;
                return `- **[${a.name}](${url})** (${sizeMiB} MiB)`;
              });

            const body = [
              marker,
              '### Build artifacts',
              '',
              `From workflow run [#${runId}](${runUrl}):`,
              '',
              ...(lines.length ? lines : [`- [Open Artifacts](${runUrl}#artifacts)`]),
              '',
              'Primary package: **ironic-centos9-iso** (ISO, kernel, initramfs, ESP, `build-info.txt`).',
              'Prefer `.kernel` + `.initramfs` for Ironic with dynamic-login kernel append params (see README).',
              '',
              '_This comment is updated on each successful PR build._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }

  publish-release:
    name: Publish GitHub Release
    needs: build-ironic-iso
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ironic-centos9-iso
          path: dist

      - name: Create GitHub Release and upload ISO
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/*.kernel
            dist/*.initramfs
            dist/*.img
            dist/build-info.txt
          draft: false
          prerelease: false
